# Dependabot opens grouped PRs weekly; each runs the full CI and, through
# CODEOWNERS, requests a review. Security updates arrive as soon as an
# advisory is published (enabled in the repository settings).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "deps"
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
